<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Badminton doubles rotation and scorekeeper for 4–8 players on one court.">
<meta name="theme-color" content="#1B7650">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doubles">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Thursday Doubles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column you can run one-handed courtside: court and score first, then the queue, table, partner grid */
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --ink:#14211B; --muted:#5A6A62; --line:#D3DED8;
  --accent:#1B7650; --accent-ink:#FFFFFF; --accent-soft:#DCEFE5;
  --court:#2B8461; --court-line:#F3FAF6;
  --lead:#A87700; --warn:#B0521B; --warn-soft:#FBE9DD; --up:#1B7650; --down:#B0521B;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#17211C; --ink:#E4EDE8; --muted:#93A59B; --line:#29382F;
    --accent:#53C08F; --accent-ink:#0A1510; --accent-soft:#1D3328;
    --court:#1F5E45; --court-line:#DCEEE4;
    --lead:#F0C23A; --warn:#E8925A; --warn-soft:#3A2418; --up:#45AB7D; --down:#C9703F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --ink:#E4EDE8; --muted:#93A59B; --line:#29382F;
  --accent:#53C08F; --accent-ink:#0A1510; --accent-soft:#1D3328;
  --court:#1F5E45; --court-line:#DCEEE4;
  --lead:#F0C23A; --warn:#E8925A; --warn-soft:#3A2418; --up:#45AB7D; --down:#C9703F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:2.4rem;font-weight:700;line-height:1;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:1.05rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.9rem;color:var(--accent)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;color:var(--ink)}
button.pill{border-color:var(--accent);color:var(--accent);font-weight:600}
.pill.done{border-color:var(--warn);color:var(--warn)}

.arrive{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.arrive p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.danger{border:1px solid var(--warn);color:var(--warn);background:transparent}
.btn.full{width:100%;min-height:52px;font-size:1.05rem}

/* court */
.court{display:grid;grid-template-columns:1fr 8px 1fr;aspect-ratio:2.15/1;max-width:100%;background:var(--court);border:3px solid var(--court-line);border-radius:6px;overflow:hidden}
.half{position:relative;display:grid;grid-template-rows:1fr 1fr}
.half.a{grid-template-columns:1fr 30%}
.half.b{grid-template-columns:30% 1fr}
.half::before{content:"";position:absolute;top:0;bottom:0;border-left:2px solid var(--court-line);opacity:.6}
.half.a::before{right:30%}
.half.b::before{left:30%}
.half::after{content:"";position:absolute;top:50%;border-top:2px solid var(--court-line);opacity:.6}
.half.a::after{left:0;right:30%}
.half.b::after{right:0;left:30%}
.half .nm{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:clamp(1.1rem,5.4vw,1.6rem);text-transform:uppercase;letter-spacing:.04em;color:var(--court-line);position:relative;z-index:1;min-width:0;overflow-wrap:anywhere;text-align:center}
.half .nm{margin:6px;border-radius:6px;padding:0 4px}
.half .nm.sel{background:var(--court-line);color:var(--court)}
button.chip{min-height:36px;padding:4px 14px}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.half.a .nm{grid-column:1}
.half.b .nm{grid-column:2}
.net{background:repeating-linear-gradient(0deg,var(--court-line) 0 3px,transparent 3px 7px)}

.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.score{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.score output{font-family:var(--font-display);font-weight:700;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.score output.lead{color:var(--lead)}
.step{width:48px;height:48px;border-radius:10px;font-size:1.6rem;line-height:1;font-weight:500;display:grid;place-items:center}
.step.minus{color:var(--muted)}
.step.plus{background:var(--accent-soft);color:var(--accent)}
.sits{margin:0;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:.9rem}
.donecard{padding:20px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.donecard p{margin:0}

/* queue */
.queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.queue li{display:grid;grid-template-columns:3rem 1fr;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
.gno{font-family:var(--font-display);font-weight:600;color:var(--muted);grid-row:span 2;font-size:1.1rem;font-variant-numeric:tabular-nums}
.match{min-width:0}
.match b{font-weight:600}
.match .v{color:var(--muted);padding:0 4px}
.sit{color:var(--muted);font-size:.88rem}
.muted{color:var(--muted);margin:0}

/* tables */
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.stand th,.stand td{padding:8px 6px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.stand th{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--muted)}
.stand th:nth-child(2),.stand td:nth-child(2){text-align:left}
.stand td:first-child,.stand th:first-child{text-align:left;width:2rem;color:var(--muted)}
.stand tr.top td:nth-child(2){font-weight:600}
.stand tr.top td:first-child{color:var(--lead);font-weight:700}
.pos{color:var(--accent)}
.neg{color:var(--warn)}
.note{font-size:.85rem;color:var(--muted);margin:0}

.pairs{border-collapse:separate;border-spacing:4px;width:auto}
.pairs th{font-family:var(--font-display);font-weight:600;font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 2px}
.pairs th.row{text-align:right;padding-right:6px}
.pairs td{width:36px;height:36px;text-align:center;padding:0}
.dot{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.dot.full{background:var(--accent);color:var(--accent-ink)}
.dot.ring{border:2px solid var(--accent)}
.dot.miss{border:2px dashed var(--warn)}
.dot.na{background:var(--line);opacity:.5;width:10px;height:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:16px;height:16px;font-size:0}
.callout{padding:12px 14px;border-radius:12px;background:var(--warn-soft);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.callout p{margin:0}

/* roster */
.roster{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.tog .st{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.tog.on{border-color:var(--accent);color:var(--ink)}
.tog.on .st{color:var(--accent)}
.tog b{font-weight:600}

.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.results li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.results .gno{grid-row:auto;width:2.6rem}
.results .line{flex:1;min-width:0}
.results .w{font-weight:600}
.results .sc{font-family:var(--font-display);font-weight:700;font-size:1.15rem;padding:0 6px;font-variant-numeric:tabular-nums}
.results .l{color:var(--muted)}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{font-family:var(--font-display);font-weight:700;font-size:1.8rem;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper .step{border:1px solid var(--line);background:var(--surface)}

/* court controls, roster editor */
.courtbar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.courtbar .note{flex:1;min-width:12rem}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.half .nm .cr{font-family:var(--font-body);font-size:.72rem;font-weight:600;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--court-line);color:var(--court);letter-spacing:0}
.half button.nm:active{background:var(--court-line);color:var(--court)}
.rosterwrap{display:flex;flex-direction:column;gap:12px}
.redit{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:8px}
.rrow.gone .pin{text-decoration:line-through;opacity:.5}
.pin{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.pin:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.rnote{font-size:.8rem;color:var(--muted);white-space:nowrap}
.rerr{margin:0;color:var(--warn);font-weight:500}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.pin.ta{padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;resize:vertical;width:100%}
/* game mode, session planner */
a.eyebrow{text-decoration:none}
a.eyebrow:hover{text-decoration:underline;text-underline-offset:3px}
a.eyebrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.setcol{display:flex;flex-direction:column;gap:8px}
.setrow>div:first-child{flex:1 1 11rem;min-width:0}
.setrow>div:first-child p{margin:2px 0 0}
.setrow>.stepper{flex-shrink:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;padding:4px 8px;font-size:.92rem;font-weight:500;color:var(--muted);border-left:1px solid var(--line);line-height:1.2}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.rulesum{margin:0;font-weight:500}
.stepper output .unit{font-family:var(--font-body);font-size:.8rem;font-weight:500;color:var(--muted);margin-left:3px}
.step:disabled{opacity:.35;cursor:default}
.planbox{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.planrow{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:8px;align-items:baseline}
.planrow .tl{font-size:.75rem}
.planstatus{margin:4px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.status{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.status.ok{background:var(--accent-soft);color:var(--accent)}
.status.short{background:var(--warn-soft);color:var(--warn)}
.gtimer{margin:0;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.gtimer b{font-family:var(--font-display);font-size:1.15rem;font-weight:700}
/* characters */
.chars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.chars li{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.cn{font-weight:600}
.ct{font-family:var(--font-display);font-weight:700;font-size:1.45rem;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;color:var(--lead);text-wrap:balance}
.cw{margin:2px 0 0;color:var(--muted);font-size:.92rem}
/* stats */
.sub{font-family:var(--font-display);font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tl{font-family:var(--font-display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tv{font-family:var(--font-display);font-weight:700;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tu{font-size:.85rem;color:var(--muted);font-family:var(--font-body);font-weight:500;margin-left:4px}
.tw{font-weight:600;overflow-wrap:anywhere;font-size:.92rem}
.ts{color:var(--muted);font-weight:400}
.stat{width:100%;border-collapse:collapse}
.stat th,.stat td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat th{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--muted)}
.stat th:first-child,.stat td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1}
.stat td.form,.stat th.form{text-align:left}
.stat tr.selrow td{background:var(--accent-soft)}
.sortb{padding:6px 0;text-transform:inherit;letter-spacing:inherit}
.stat th[aria-sort="ascending"] .sortb,.stat th[aria-sort="descending"] .sortb{color:var(--ink)}
.pbtn{font-weight:600;text-decoration:underline dotted;text-underline-offset:3px;padding:6px 0}
.spark{display:block}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.split>div{min-width:0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:20;transition:opacity .2s}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <a class="eyebrow" id="ruleline" href="#h-mode">1 court · first to 15</a>
    <h1>Thursday Doubles</h1>
    <div class="hrow"><span id="meta" class="num"></span><span id="clock"></span></div>
  </header>

  <div id="arrivals"></div>

  <section aria-labelledby="h-court">
    <h2 id="h-court">On court</h2>
    <div id="oncourt"></div>
  </section>

  <section aria-labelledby="h-next" id="nextsec">
    <h2 id="h-next">Up next</h2>
    <div id="next"></div>
  </section>

  <section aria-labelledby="h-stand">
    <h2 id="h-stand">Standings</h2>
    <div id="standings"></div>
  </section>

  <section aria-labelledby="h-chars">
    <h2 id="h-chars">Characters</h2>
    <div id="chars"></div>
  </section>

  <section aria-labelledby="h-stats">
    <h2 id="h-stats">Stats</h2>
    <div id="stats"></div>
  </section>

  <section aria-labelledby="h-pairs">
    <h2 id="h-pairs">Partners</h2>
    <div id="pairs"></div>
  </section>

  <section aria-labelledby="h-roster">
    <h2 id="h-roster">Players</h2>
    <div id="roster" class="rosterwrap"></div>
  </section>

  <section aria-labelledby="h-results">
    <h2 id="h-results">Results</h2>
    <div id="results"></div>
  </section>

  <section aria-labelledby="h-mode">
    <h2 id="h-mode">Game mode</h2>
    <div id="mode" class="rosterwrap"></div>
  </section>

  <section aria-labelledby="h-session">
    <h2 id="h-session">Session</h2>
    <div id="session" class="rosterwrap"></div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
// ---------- planner: everyone partners everyone, even game counts, no sitting out twice in a row ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function buildStats(players,games){
  const gp={},P={},O={};
  players.forEach(p=>gp[p.id]=0);
  for(const g of games){
    for(const id of [...g.a,...g.b]) gp[id]=(gp[id]||0)+1;
    P[pk(g.a[0],g.a[1])]=(P[pk(g.a[0],g.a[1])]||0)+1;
    P[pk(g.b[0],g.b[1])]=(P[pk(g.b[0],g.b[1])]||0)+1;
    for(const x of g.a)for(const y of g.b)O[pk(x,y)]=(O[pk(x,y)]||0)+1;
  }
  return {gp,P,O};
}
function combos4(n){const r=[];for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++)r.push([a,b,c,d]);return r;}
function planGames(players,history,count,opts={}){
  const restarts=opts.restarts||300,rng=mulberry32(opts.seed||7);
  const active=players.filter(p=>p.here).map(p=>p.id);
  if(active.length<4||count<=0) return [];
  // With 8 players half the group sits each game; a softer sit-out penalty lets everyone partner everyone
  const sitW=active.length>=8?8:25,sitF=active.length>=8?10:40;
  const off={};players.forEach(p=>off[p.id]=p.offset||0);
  const base=buildStats(players,history);
  const last=history[history.length-1];
  const C=combos4(active.length);
  let best=null,bestScore=Infinity;
  for(let r=0;r<restarts;r++){
    const gp={...base.gp},P={...base.P},O={...base.O};
    let lastIn=last?new Set([...last.a,...last.b]):null;
    const plan=[];let sitTwice=0;
    for(let k=0;k<count;k++){
      const eff=active.map(id=>(gp[id]||0)+off[id]);
      const sorted=[...eff].sort((x,y)=>x-y);
      const minSum=sorted[0]+sorted[1]+sorted[2]+sorted[3];
      let opt=null,optC=Infinity;
      for(const c of C){
        const ids=c.map(i=>active[i]);
        const fair=(c.reduce((s,i)=>s+eff[i],0)-minSum)*12;
        let sit=0;
        if(lastIn){for(const id of active){if(!ids.includes(id)&&!lastIn.has(id))sit+=sitW;}}
        for(const [x,y,z,w] of [[0,1,2,3],[0,2,1,3],[0,3,1,2]]){
          const a=[ids[x],ids[y]],b=[ids[z],ids[w]];
          const p1=P[pk(a[0],a[1])]||0,p2=P[pk(b[0],b[1])]||0;
          const part=((p1+1)**2-1+(p2+1)**2-1)*4;
          let opp=0;for(const u of a)for(const v of b)opp+=(O[pk(u,v)]||0);
          const cost=fair+sit+part+opp*0.6+rng()*3;
          if(cost<optC){optC=cost;opt={a,b};}
        }
      }
      const ids=[...opt.a,...opt.b];
      if(lastIn){for(const id of active){if(!ids.includes(id)&&!lastIn.has(id))sitTwice++;}}
      for(const id of ids)gp[id]=(gp[id]||0)+1;
      P[pk(opt.a[0],opt.a[1])]=(P[pk(opt.a[0],opt.a[1])]||0)+1;
      P[pk(opt.b[0],opt.b[1])]=(P[pk(opt.b[0],opt.b[1])]||0)+1;
      for(const u of opt.a)for(const v of opt.b)O[pk(u,v)]=(O[pk(u,v)]||0)+1;
      plan.push(opt);lastIn=new Set(ids);
    }
    let unc=0,rep=0,opp2=0;
    for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++){
      const p=P[pk(active[i],active[j])]||0;if(p===0)unc++;rep+=p*p;opp2+=(O[pk(active[i],active[j])]||0)**2;
    }
    const effs=active.map(id=>(gp[id]||0)+off[id]);
    const imb=Math.max(...effs)-Math.min(...effs);
    const score=unc*100+sitTwice*sitF+imb*imb*15+rep*2+opp2*0.3;
    if(score<bestScore){bestScore=score;best=plan;}
  }
  return best;
}

// ---------- state ----------

// ---------- game mode ----------

const DEFAULT_RULES={target:15,deuce:'cap',cap:20,limit:0,timeUp:'golden',sessionMin:120,warmup:0,rounds:1};
const PRESETS=[
  {id:'club15',label:'Club 15',r:{target:15,deuce:'cap',cap:20,limit:0}},

const CHANGEOVER_MIN=1,DEFAULT_SPP=22;
function sanitizeRules(x){
  const r={...DEFAULT_RULES},o=x&&typeof x==='object'?x:{};

  if(int(o.target,3,50))r.target=o.target;
  if(['none','cap','nocap'].includes(o.deuce))r.deuce=o.deuce;
  r.cap=int(o.cap,r.target+1,99)?o.cap:Math.max(r.target+1,Math.min(99,r.target+(DEFAULT_RULES.cap-DEFAULT_RULES.target)));

function R(){if(!state.rules)state.rules=sanitizeRules(null);return state.rules;}
const maxPts=(r=R())=>r.deuce==='none'?r.target:r.deuce==='cap'?r.cap:99;
// a finished score under the points rules alone
function regularWin(a,b,r=R()){
  const hi=Math.max(a,b),lo=Math.min(a,b),t=r.target;

  if(lo>=t-1&&hi-lo===2&&(r.deuce==='nocap'||hi<=r.cap))return true;

// ---------- session planner: how long a game takes, and how many fit ----------
function pace(){

  const H=state.history.filter(g=>g.t);const xs=[];
  for(let i=1;i<H.length;i++){const gap=(H[i].t-H[i-1].t)/1000,pts=H[i].sa+H[i].sb;if(gap>=120&&gap<=1800&&pts>0)xs.push((gap-CHANGEOVER_MIN*60)/pts);}

function pointsPerGame(r=R()){

  if(same.length>=3)return same.reduce((s,g)=>s+g.sa+g.sb,0)/same.length;

  }
  save();render();if(msg)toast(msg);
}

// ---------- stats ----------
let statSort={k:'pw',d:-1},statPlayer=null;
const sgn=(x,dp=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(dp);
const names=a=>a.join(' &amp; ');
function computeStats(){
  const S={},pairs={},vs={};
  state.players.forEach(p=>S[p.id]={id:p.id,P:0,W:0,D:0,pf:0,pa:0,form:[],dW:0,dL:0,cur:0,bestStreak:0,crt:0,crTeam:0,crG:0});
  state.history.forEach((g,gi)=>{
    const deuce=isDeuce(g);
    for(const [side,other,sf,so] of [[g.a,g.b,g.sa,g.sb],[g.b,g.a,g.sb,g.sa]]){
      const win=sf>so,draw=sf===so,m=sf-so;
      for(const id of side){
        const r=S[id];r.P++;r.pf+=sf;r.pa+=so;r.form.push({g:gi+1,m});

function saveRoster(){

  const keep=editDraft.filter(r=>!r.rm),add=(($('#pn-new')||{}).value||'').trim();

  const bad=names.find(n=>!NAME_RE.test(n));
  const lower=names.map(n=>n.toLowerCase());
  if(names.some(n=>!n))editErr='Every player needs a name.';
  else if(bad)editErr=`“${bad.replace(/[<>&"]/g,'')}” can only use letters, numbers, spaces, hyphens, dots and apostrophes.`;
  else if(new Set(lower).size!==lower.length)editErr='Two players have the same name. Make each one different.';
  else if(names.length<MIN_PLAYERS)editErr=`Doubles needs at least ${MIN_PLAYERS} players.`;
  else if(names.length>MAX_PLAYERS)editErr=`Up to ${MAX_PLAYERS} players on one court.`;
  else editErr='';
  if(editErr){renderRoster();return;}
  const removed=editDraft.filter(r=>r.rm).map(r=>r.orig);
  const map={};keep.forEach(r=>{const n=r.name.trim();if(n!==r.orig)map[r.orig]=n;});
  if(Object.keys(map).length)renamePlayers(map);
  state.players=state.players.filter(p=>!removed.includes(p.id));

    const minEff=here.length?Math.min(...here.map(p=>st.gp[p.id]+(p.offset||0))):0;

  }

  const changed=removed.length||add;
  if(changed&&!state.history.length)state.target=gamesToPairAll(state.players.filter(p=>p.here).length);
  if(changed)replan('Players saved. Games after this one are re-planned.');
  else{save();render();toast('Players saved.');}
}

}
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
const stepHTML=(k,val,decDis,incDis,lab)=>`<div class="stepper"><button class="step" id="${k}-dec" data-act="rule" data-k="${k}" data-d="-1" aria-label="Lower ${lab}" ${decDis?'disabled':''}>−</button><output class="num">${val}</output><button class="step" id="${k}-inc" data-act="rule" data-k="${k}" data-d="1" aria-label="Raise ${lab}" ${incDis?'disabled':''}>+</button></div>`;
const segHTML=(k,opts,cur,lab)=>`<div class="seg" role="group" aria-label="${lab}">${opts.map(([v,t])=>`<button id="${k}-${v}" data-act="ruleset" data-k="${k}" data-v="${v}" aria-pressed="${cur===v}">${t}</button>`).join('')}</div>`;
function renderMode(){
  const r=R(),pre=PRESETS.find(p=>Object.entries(p.r).every(([k,v])=>r[k]===v));
  $('#mode').innerHTML=`
  <div class="pickrow">${PRESETS.map(p=>`<button class="chip ${pre&&pre.id===p.id?'sel':''}" id="preset-${p.id}" data-act="preset" data-id="${p.id}" aria-pressed="${!!pre&&pre.id===p.id}">${p.label}</button>`).join('')}</div>
  <p class="rulesum">${rulesSentence()}</p>
  <div class="setrow"><b>Points to win</b>${stepHTML('target',r.target,r.target<=5,r.target>=30,'points to win')}</div>
  <div class="setcol"><div><b>Deuce</b><p class="muted">${r.deuce==='none'?`The first side to ${r.target} wins.`:`From ${r.target-1}–${r.target-1}, a side must win by 2.`}</p></div>${segHTML('deuce',[['none','Off'],['cap','On, capped'],['nocap','On, no cap']],r.deuce,'Deuce')}</div>
  ${r.deuce==='cap'?`<div class="setrow"><div><b>Cap</b><p class="muted num">${r.cap}–${r.cap-1} wins the game.</p></div>${stepHTML('cap',r.cap,r.cap<=r.target+1,r.cap>=r.target+15,'cap')}</div>`:''}
  <div class="setrow"><div><b>Time limit per game</b><p class="muted">${r.limit?'Starts at the first point of each game.':'Off. Games play to the score.'}</p></div>${stepHTML('limit',r.limit?`${r.limit}<span class="unit">min</span>`:'Off',r.limit===0,r.limit>=30,'time limit')}</div>
  ${r.limit?`<div class="setcol"><b>Level when time is up</b>${segHTML('timeUp',[['golden','Next point wins'],['draw','Draw']],r.timeUp,'Level when time is up')}</div>`:''}
  <p class="note">Changes apply from the game on court. Finished games keep their scores.</p>`;
}
let resetArmed=false,resetT;
function renderSession(){
  const r=R(),min=Math.max(1,state.history.length),nHere=state.players.filter(p=>p.here).length,G1=gamesToPairAll(nHere);
  const pc=pace(),ppg=pointsPerGame(),gm=gameMinutes(),fullMin=ppg*pc.spp/60,capped=!!r.limit&&fullMin>r.limit;
  const elapsed=state.clockStart?(Date.now()-state.clockStart)/60000:0;
  const avail=Math.max(0,r.sessionMin-Math.max(elapsed,r.warmup));
  const left=state.plan.length,fits=Math.floor(avail/gm),running=!!state.clockStart;
  let status='',fixes=[];
  if(left&&fits>=left){
    const spare=avail-left*gm;
    status=`<span class="status ok">Fits</span> with about ${fmtDur(spare)} to spare.`;
    if(fits>left)fixes.push(`<button class="btn ghost small" data-act="settarget" data-n="${state.history.length+fits}">Fill the time: ${state.history.length+fits} games</button>`);
  }else if(left){
    status=`<span class="status short">Too long</span> About ${left-fits} game${left-fits>1?'s':''} more than the time allows.`;
    const per=avail/left-CHANGEOVER_MIN,ratio=ppg/r.target,t=Math.floor(per*60/pc.spp/ratio);
    if(t>=5&&t<r.target)fixes.push(`<button class="btn ghost small" data-act="suggest" data-k="target" data-v="${t}">Play to ${t}</button>`);
    const L=Math.floor(per);
    if(L>=3&&(!r.limit||L<r.limit))fixes.push(`<button class="btn ghost small" data-act="suggest" data-k="limit" data-v="${L}">${L}-min time limit</button>`);
    if(fits>0)fixes.push(`<button class="btn ghost small" data-act="settarget" data-n="${state.history.length+fits}">Plan ${state.history.length+fits} games</button>`);
  }
  $('#session').innerHTML=`
  <div class="planbox">
    <div class="planrow"><span class="tl">Each game</span><span><b class="num">about ${Math.round(gm)} min</b><span class="muted"> · ${capped?`${r.limit}-min limit (a full game to ${r.target} takes about ${Math.round(fullMin)} min)`:`${Math.round(ppg)} points at ${Math.round(pc.spp)} s a point${pc.n?`, your pace over ${pc.n} games`:''}`}, plus ${CHANGEOVER_MIN} min to swap</span></span></div>
    <div class="planrow"><span class="tl">Time</span><span><b class="num">${fmtDur(avail)}</b><span class="muted"> of games${running?' left':''} fits about ${fits}</span></span></div>
    <div class="planrow"><span class="tl">Planned</span><span><b class="num">${left} game${left===1?'':'s'}${running||state.history.length?' left':''}</b><span class="muted"> · ${nHere} players need ${G1} for everyone to partner everyone once</span></span></div>
    ${status?`<p class="planstatus">${status}</p>`:''}
    ${fixes.length?`<div class="ractions">${fixes.join('')}</div>`:''}
  </div>
  <div class="setrow"><div><b>Session length</b><p class="muted">The whole booking, warm-up included.</p></div>${stepHTML('sessionMin',fmtDur(r.sessionMin),r.sessionMin<=30,r.sessionMin>=300,'session length')}</div>
  <div class="setrow"><div><b>Warm-up</b><p class="muted">Time before the first scored game.</p></div>${stepHTML('warmup',r.warmup?`${r.warmup}<span class="unit">min</span>`:'None',r.warmup<=0,r.warmup>=Math.min(60,r.sessionMin-15),'warm-up')}</div>
  <div class="setrow"><div><b>Rounds</b><p class="muted">How many times everyone partners everyone.</p></div>${stepHTML('rounds',r.rounds,r.rounds<=1,r.rounds>=4,'rounds')}</div>
  <div class="setrow"><div><b>Games tonight</b><p class="muted">Set it yourself, or use the buttons above.</p></div>
    <div class="stepper"><button class="step" id="tdec" data-act="tdec" aria-label="One game fewer" ${state.target<=min?'disabled':''}>−</button><output class="num">${state.target}</output><button class="step" id="tinc" data-act="tinc" aria-label="One game more">+</button></div></div>
    <div class="setrow"><div><b>Move or back up this session</b><p class="muted">Copy it here, then paste it into the other page or phone.</p></div>
      <div class="ractions"><button class="btn ghost" id="exportbtn" data-act="export">Copy session</button><button class="btn ghost" id="importbtn" data-act="importopen" aria-expanded="${importing}">Paste a session</button></div></div>
    ${exportText?`<div class="redit"><label class="muted" for="exporttext">Copying was blocked here. Select all of this text and copy it yourself:</label><textarea id="exporttext" class="pin ta" rows="4" readonly>${exportText}</textarea></div>`:''}
    ${importing?`<form id="importform" class="redit" novalidate><label class="muted" for="importtext">Paste the copied session. Loading it replaces the session on this phone.</label>
      <textarea id="importtext" class="pin ta" rows="4" placeholder="Paste here"></textarea>
      ${importErr?`<p class="rerr" role="alert">${importErr}</p>`:''}
      <div class="ractions"><button type="submit" class="btn primary">Load session</button><button type="button" class="btn ghost" data-act="importcancel">Cancel</button></div></form>`:''}
    <div class="setrow"><p class="muted">Clear all scores and start a new session. Players and game mode are kept.</p><button class="btn danger" id="reset" data-act="reset">${resetArmed?'Tap again to clear':'Reset session'}</button></div>`;
}
let importing=false,importErr='',exportText='';
function sessionText(){return JSON.stringify({app:'thursday-doubles',v:3,players:state.players.map(p=>({id:p.id,here:p.here,offset:p.offset||0})),history:state.history,target:state.target,rules:R()});}
function importSession(txt){
  let d;try{d=JSON.parse(String(txt).trim());}catch(e){return 'That isn\'t a copied session. Use Copy session on the other page and paste again.';}
  if(!d||!Array.isArray(d.players)||!Array.isArray(d.history))return 'That isn\'t a copied session. Use Copy session on the other page and paste again.';
  const ids=d.players.map(p=>p&&p.id);
  if(ids.length<MIN_PLAYERS||ids.length>MAX_PLAYERS||ids.some(x=>typeof x!=='string'||!NAME_RE.test(x))||new Set(ids).size!==ids.length)return 'The player list in that session isn\'t valid.';
  const okScore=x=>Number.isInteger(x)&&x>=0&&x<=99;
  if(!d.history.every(g=>g&&Array.isArray(g.a)&&Array.isArray(g.b)&&g.a.length===2&&g.b.length===2&&new Set([...g.a,...g.b]).size===4&&[...g.a,...g.b].every(x=>ids.includes(x))&&okScore(g.sa)&&okScore(g.sb)))return 'Some games in that session aren\'t valid.';
  const players=d.players.map(p=>({id:p.id,here:p.here!==false,offset:Math.max(0,+p.offset||0)}));
  const history=d.history.map(g=>{const o={a:g.a.slice(),b:g.b.slice(),sa:g.sa,sb:g.sb,t:+g.t||0};
    if(Number.isInteger(g.to)&&g.to>=3&&g.to<=50)o.to=g.to;
    if(g.dz===false)o.dz=false;
    if(g.timed===true)o.timed=true;
    if(g.cr&&typeof g.cr==='object'){const c={};for(const k in g.cr)if(ids.includes(k)&&Number.isInteger(g.cr[k])&&g.cr[k]>0)c[k]=g.cr[k];if(Object.keys(c).length)o.cr=c;}return o;});
  if(players.filter(p=>p.here).length<MIN_PLAYERS)players.forEach(p=>p.here=true);
  const target=Math.max(history.length,Number.isInteger(d.target)?Math.min(d.target,60):history.length);
  state={players,history,plan:[],cur:{sa:0,sb:0,log:[]},target,clockStart:null,rules:sanitizeRules(d.rules||(state&&state.rules))};
  state.plan=planGames(players,history,target-history.length);
  sel=null;swapMode=false;statPlayer=null;editing=false;
  return '';
}

// ---------- actions ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act;
  if(act==='inc'){if(addPoint(b.dataset.side,null)){save();renderCourt();}return;}
  if(act==='dec'){removePoint(b.dataset.side);save();renderCourt();return;}
  if(act==='credit'){
    const id=b.dataset.id,g=state.plan[0];if(!g)return;
    if(addPoint(g.a.includes(id)?'a':'b',id)){save();renderCourt();}return;
  }
  if(act==='swapmode'){swapMode=!swapMode;sel=null;renderCourt();return;}
  if(act==='pick'){
    const id=b.dataset.id,g=state.plan[0];
    if(!g)return;
    if(!sel||sel===id){sel=sel===id?null:id;renderCourt();return;}
    const x=sel;sel=null;
    const swap=t=>t.map(p=>p===x?id:p===id?x:p);
    state.plan[0]={a:swap(g.a),b:swap(g.b)};
    const t=state.plan[0];curLog().forEach(e=>{if(e.by&&!t[e.s].includes(e.by))e.by=null;});
    replan(`Swapped ${x} and ${id}. Later games re-planned.`);
    return;
  }
  if(act==='export'){
    const txt=sessionText();exportText='';
    const fallback=()=>{exportText=txt;renderSession();const t=$('#exporttext');if(t&&t.select){t.focus();t.select();}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>{renderSession();toast('Session copied. Paste it into the other page.');}).catch(fallback);}else fallback();}catch(err){fallback();}
    return;
  }
  if(act==='importopen'){importing=!importing;importErr='';exportText='';renderSession();return;}
  if(act==='importcancel'){importing=false;importErr='';renderSession();return;}
  if(act==='edit'){editing=true;editErr='';editDraft=state.players.map(p=>({orig:p.id,name:p.id,rm:false}));renderRoster();return;}
  if(act==='canceledit'){editing=false;editDraft=null;editErr='';renderRoster();return;}
  if(act==='rm'){const i=+b.dataset.i;editDraft.forEach((r,j)=>{const inp=$('#pn-'+j);if(inp&&!r.rm)r.name=inp.value;});editDraft[i].rm=!editDraft[i].rm;renderRoster();return;}
  if(act==='sort'){const key=b.dataset.k,def=(key==='id'||key==='pag')?1:-1;statSort=statSort.k===key?{k:key,d:-statSort.d}:{k:key,d:def};renderStats();return;}
  if(act==='statp'){statPlayer=b.dataset.id;renderStats();return;}
  if(act==='clear'){state.cur={sa:0,sb:0,log:[]};save();renderCourt();toast('Score reset to 0–0.');return;}
  if(act==='finish'){
    sel=null;
    const g=state.plan[0],{sa,sb}=state.cur;
    if(!validScore(sa,sb)){toast(`Not a final score yet. ${rulesSentence()}`);return;}
    const cr=credits(state.cur.log),r=R(),timed=!regularWin(sa,sb);
    state.history.push(Object.assign({a:g.a,b:g.b,sa,sb,t:Date.now(),to:r.target},r.deuce==='none'?{dz:false}:{},timed?{timed:true}:{},Object.keys(cr).length?{cr}:{}));
    swapMode=false;
    state.plan.shift();state.cur={sa:0,sb:0,log:[]};save();render();
    toast(sa===sb?`Game ${state.history.length} saved. A draw at ${sa}–${sb}.`:`Game ${state.history.length} saved. ${sa>sb?g.a.join(' & '):g.b.join(' & ')} win ${Math.max(sa,sb)}–${Math.min(sa,sb)}${timed?' on time':''}.`);
    window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    return;
  }
  if(act==='undo'){
    const g=state.history.pop();state.plan.unshift({a:g.a,b:g.b});
    const log=[];for(const s of ['a','b']){let n=g['s'+s];for(const id of g[s]){const c=(g.cr&&g.cr[id])||0;for(let i=0;i<c;i++){log.push({s,by:id});n--;}}for(let i=0;i<n;i++)log.push({s,by:null});}
    state.cur={sa:g.sa,sb:g.sb,log};
    if(g.timed&&R().limit)state.cur.start=Date.now()-R().limit*60000;
    save();render();toast(`Game ${state.history.length+1} is back on court with its score.`);return;
  }
  if(act==='toggle'){
    const p=state.players.find(x=>x.id===b.dataset.id);
    if(p.here){
      if(state.players.filter(x=>x.here).length<=4){toast('Doubles needs at least 4 players.');return;}
      p.here=false;replan(`${p.id} is out. Games after this one are re-planned.`);
    }else{
      const st=buildStats(state.players,state.history);
      const others=state.players.filter(x=>x.here);
      const minEff=Math.min(...others.map(x=>st.gp[x.id]+(x.offset||0)));
      p.offset=Math.max(0,minEff-st.gp[p.id]);p.here=true;
      replan(`${p.id} is in. Games after this one are re-planned.`);
    }
    return;
  }
  if(act==='more'){state.target=state.history.length+1;replan('Added a game.');return;}
  if(act==='settarget'){state.target=+b.dataset.n;replan(`Planned ${state.target} games.`);return;}
  if(act==='tinc'){state.target++;replan(`${state.target} games tonight.`);return;}
  if(act==='tdec'){state.target=Math.max(state.history.length,state.target-1);replan(`${state.target} games tonight.`);return;}
  if(act==='clock'){state.clockStart=Date.now();save();renderClock();renderSession();return;}
  if(act==='rule'){
    const r=R(),k=b.dataset.k,d=+b.dataset.d;
    if(k==='target'){const off=Math.max(1,r.cap-r.target);r.target=clamp(r.target+d,5,30);r.cap=Math.min(99,r.target+off);}
    if(k==='cap')r.cap=clamp(r.cap+d,r.target+1,r.target+15);
    if(k==='limit')r.limit=r.limit===0?(d>0?5:0):(d<0&&r.limit<=5?0:clamp(r.limit+d,5,30));
    if(k==='sessionMin'){r.sessionMin=clamp(r.sessionMin+15*d,30,300);r.warmup=Math.min(r.warmup,r.sessionMin-15);}
    if(k==='warmup')r.warmup=clamp(r.warmup+5*d,0,Math.min(60,r.sessionMin-15));
    if(k==='rounds'){
      r.rounds=clamp(r.rounds+d,1,4);
      state.target=Math.max(state.history.length+(state.plan.length?1:0),r.rounds*gamesToPairAll(state.players.filter(p=>p.here).length));
      replan(`${r.rounds} round${r.rounds>1?'s':''}: ${state.target} games.`);return;
    }
    save();render();return;
  }
  if(act==='ruleset'){const r=R();r[b.dataset.k]=b.dataset.v;save();render();return;}
  if(act==='preset'){
    const p=PRESETS.find(x=>x.id===b.dataset.id);if(!p)return;
    Object.assign(R(),p.r);save();render();toast(`${p.label}: ${rulesLine()}.`);return;
  }
  if(act==='suggest'){
    const r=R(),k=b.dataset.k,v=+b.dataset.v;
    if(k==='target'){const off=Math.max(1,r.cap-r.target);r.target=clamp(v,5,30);r.cap=Math.min(99,r.target+off);toast(`Games are now to ${r.target}.`);}
    if(k==='limit'){r.limit=clamp(v,3,30);toast(`Games now stop after ${r.limit} minutes.`);}
    save();render();return;
  }
  if(act==='reset'){
    if(!resetArmed){resetArmed=true;renderSession();clearTimeout(resetT);resetT=setTimeout(()=>{resetArmed=false;renderSession();},3500);return;}
    resetArmed=false;clearTimeout(resetT);sel=null;swapMode=false;state=newSession(state.players.map(p=>p.id),state.rules);save();render();toast('New session started. Players and game mode are kept.');return;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='rosterform'){e.preventDefault();saveRoster();}
  if(e.target.id==='importform'){
    e.preventDefault();
    const err=importSession(($('#importtext')||{}).value||'');
    if(err){importErr=err;renderSession();return;}
    importing=false;importErr='';save();render();toast(`Loaded ${state.history.length} games for ${state.players.length} players.`);
    window.scrollTo({top:0});
  }
});
setInterval(()=>{if(!state)return;renderClock();if(state.clockStart&&!importing&&!exportText&&!resetArmed)renderSession();},20000);
// per-game countdown: update the line every second, redraw the court once when time runs out
setInterval(()=>{
  if(!state||!R().limit||!state.plan[0])return;
  const t=$('#gtimer');if(t)t.innerHTML=gameTimerText();
  if(timeIsUp()!==courtTimeUp)renderCourt();
},1000);

// keep the screen awake while scoring, where the browser allows it
let wake=null;
async function keepAwake(){try{if(!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null);}}catch(e){}}
document.addEventListener('pointerdown',keepAwake,{once:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state)keepAwake();});

function start(data){
  state=(data&&data.key===KEY&&data.state)||load()||initial();
  render();
}
window.claude?.hot?.snapshot?.(()=>({state,key:KEY}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

// Offline support on GitHub Pages (needs https or localhost)
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
